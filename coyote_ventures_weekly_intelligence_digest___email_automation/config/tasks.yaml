---
search_for_candidate_articles:
  description: |
    Run 12 distinct news searches—one search per required keyword. Each search must
    include the date filter "after:YYYY-MM-DD" (today minus 7 days). Use only the
    first 5 results returned per search (up to 60 articles total). Reject any article
    older than 7 days.

    The 12 required keywords (search each once):
    health startup valuation, health tech, remote patient monitoring (rpm), US health legislation,
    electronic health records (EHR), healthcare innovation, health equity, digital health technology,
    AI health, virtual health, care model, health conference.

    After EACH search, insert that search's results via supabase_write_candidates: at most 3 articles
    per call (longer payloads are truncated by the platform, so only 2–3 would be inserted). If the search
    returned 4 or 5 articles, call supabase_write_candidates twice (e.g. first 3, then the rest). Use
    compact JSON (minimal whitespace). Never pass more than 3 articles in one call.

    After completing all 12 searches (and 12 insert calls), output the full
    CANDIDATE_ARTICLES list (title, URL, source, published date) and a
    SEARCH LOG listing all 12 queries and article count per query. Do not truncate
    the list.
  expected_output: |
    TOTAL ARTICLES COLLECTED: [count]
    CANDIDATE_ARTICLES: numbered list 60 articles (title, URL, source, date).
    SEARCH LOG: all 12 search queries and how many articles each returned.
  agent: healthcare_news_discovery_specialist
  async_execution: true

evaluate_investment_relevance:
  description: |
    CRITICAL: You MUST call the supabase_write_evaluations tool for each batch. This task is INCOMPLETE and FAILS if you only output text without calling the tool. The database insertions are the primary deliverable.

    Batched workflow (repeat until no more candidates):
    1. Call supabase_read_candidates(limit=5, offset=N) with N starting at 0. The tool returns only unevaluated candidates (newest first), so you never re-evaluate. Use ONLY the returned "articles" array; do NOT use URLs or titles from the previous task (search) output.
    2. If "count" is 0 or "articles" is empty, you are done—output PROCESSED_ARTICLES summary and stop.
    3. For each article in this batch, first obtain the full investment thesis text from {thesis_url} (e.g., using the ScrapeWebsiteTool configured on that URL or a cached copy), then call thesis_title_relevance_tool with thesis_text set to that full thesis text (NOT the URL) and article_title set to that article's title. Do not ever pass the URL itself as thesis_text.
    4. Build evaluation objects: set each "candidate_id" to that article's "id" (UUID) from the same read_candidates response. Do not use id from task context or Discovery—only from the current read_candidates "articles" array.
    5. Call supabase_write_evaluations with evaluations_json set to a JSON string of those objects.
    6. Set N = N + 5 and go back to step 1. Continue until read_candidates returns 0 articles.
    7. Do NOT put the evaluations_json string only in your Final Answer. You must actually CALL the supabase_write_evaluations tool so that the database is updated.
    8. Your Final Answer should summarize what you did (PROCESSED_ARTICLES summary) and may show the tool outputs, but it should NOT just return the JSON payload.

    Example: read_candidates(limit=5, offset=0) → score 5 → write_evaluations(those 5) → read_candidates(limit=5, offset=5) → score 5 → write_evaluations → ... until count is 0.
  expected_output: |
    First: Evidence that supabase_write_evaluations was called (tool output showing inserted counts). Then: PROCESSED_ARTICLES list and summary (total_evaluated, accepted, rejected). Do NOT output the evaluations_json array itself as the Final Answer; only tool calls count. If no supabase_write_evaluations tool calls are shown, the task is incomplete.
  agent: thesis_relevance_judge
  context:
    - search_for_candidate_articles
