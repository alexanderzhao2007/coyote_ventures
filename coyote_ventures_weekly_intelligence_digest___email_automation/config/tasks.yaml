---
search_for_candidate_articles:
  description: |
    Run 12 distinct news searches—one search per required keyword. Each search must
    include the date filter "after:YYYY-MM-DD" (today minus 7 days). Use only the
    first 5 results returned per search (up to 60 articles total). Reject any article
    older than 7 days.

    The 12 required keywords (search each once):
    health startup valuation, health tech, health acquisition, US health legislation,
    electronic health records (EHR), healthcare innovation, health equity, digital health technology,
    AI health, virtual health, care model, health conference.

    After EACH search, immediately call supabase_write_candidates with that search's
    results (a JSON array of up to 5 articles: url, title, source, published_date).
    This avoids a single huge tool payload getting truncated and ensures all unique
    URLs are available in Supabase even if terminal output is cut off.

    After completing all 12 searches (and 12 insert calls), output the full
    CANDIDATE_ARTICLES list (title, URL, source, published date) and a
    SEARCH LOG listing all 12 queries and article count per query. Do not truncate
    the list.
  expected_output: |
    TOTAL ARTICLES COLLECTED: [count]
    CANDIDATE_ARTICLES: numbered list 60 articles (title, URL, source, date).
    SEARCH LOG: all 12 search queries and how many articles each returned.
  agent: healthcare_news_discovery_specialist
  async_execution: true

evaluate_investment_relevance:
  description: |
    CRITICAL: You MUST call the supabase_write_evaluations tool. This task is INCOMPLETE and FAILS if you only output text without calling the tool. The database insertions are the primary deliverable.

    Workflow:
    1. Call supabase_read_candidates(limit=60). Use ONLY the returned "articles" array as your list of candidates. Do NOT use URLs or titles from the previous task (search) output—those can be truncated or different and cause insert failures.
    2. For each article in that array, call thesis_title_relevance_tool with thesis from {thesis_url} and that article's title.
    3. When building each evaluation object, use the EXACT "url" from the same article in the supabase_read_candidates response. Copy the url field; do not take it from task context or anywhere else.
    4. After every 10 evaluations, call supabase_write_evaluations with evaluations_json set to a JSON string (stringified array of those objects).
    5. After each call, check "inserted". If many skipped_foreign_key, you are using URLs from the wrong source—use ONLY urls from supabase_read_candidates.
    6. Repeat until all candidates from step 1 are evaluated and inserted.
    7. Output PROCESSED_ARTICLES summary.

    Example tool call format:
    supabase_write_evaluations(evaluations_json='[{"url":"...","relevance_score":65,...}]')
  expected_output: |
    First: Evidence that supabase_write_evaluations was called (tool output showing inserted counts). Then: PROCESSED_ARTICLES list and summary (total_evaluated, accepted, rejected). If no tool calls are shown, the task is incomplete.
  agent: thesis_relevance_judge
  context:
    - search_for_candidate_articles
