---
search_for_candidate_articles:
  description: |
    Run 12 distinct news searches—one search per required keyword. Each search must
    include the date filter "after:YYYY-MM-DD" (today minus 7 days). Use only the
    first 5 results returned per search (up to 60 articles total). Reject any article
    older than 7 days.

    The 12 required keywords (search each once):
    health startup valuation, health tech, remote patient monitoring (rpm), health access,
    electronic health records (EHR), healthcare innovation, health equity, digital health technology,
    AI health, virtual health, health platform, health conference.

    After EACH search, immediately call supabase_write_candidates once with ONLY that search's
    results (a JSON array of at most 5 articles: url, title, source, published_date). Use compact JSON.
    Never pass more than 5 articles in one call. Do not stop until all 12 searches are done and the sum
    of "inserted" from all write_candidates outputs is at least 40 (target 40–60).

    After completing all 12 searches and all write_candidates calls, output the full
    CANDIDATE_ARTICLES list (title, URL, source, published date) and a
    SEARCH LOG listing all 12 queries and article count per query. Do not truncate
    the list.
  expected_output: |
    TOTAL ARTICLES COLLECTED: [count] (target 40–60)
    Total inserted (from all write_candidates outputs): [sum]
    CANDIDATE_ARTICLES: numbered list of all collected articles (title, URL, source, date).
    SEARCH LOG: all 12 search queries and how many articles each returned.
  agent: healthcare_news_discovery_specialist
  async_execution: true

evaluate_investment_relevance:
  description: |
    CRITICAL: You MUST call the supabase_write_evaluations tool for each batch. This task is INCOMPLETE and FAILS if you only output text without calling the tool. The database insertions are the primary deliverable.

    Process (repeat until no unevaluated articles remain):
    1. Read: Call supabase_read_candidates(limit=5, offset=0). You MUST pass limit=5 and offset=0. This returns at most 5 unevaluated candidates (newest first). Do NOT use any other source of articles—only evaluate articles from this call's "articles" array. After you write evaluations for a batch, those candidates are removed from the unevaluated view, so the next read (again offset=0) returns the next 5.
    2. If "count" is 0 or "articles" is empty, you are done—output PROCESSED_ARTICLES summary and stop.
    3. Evaluate: For each of the at most 5 articles from step 1 only, call thesis_title_relevance_tool(article_title=<title>, use_static_thesis=True). Do NOT scrape the thesis—the tool uses the pre-loaded condensed thesis. Call the tool exactly 5 times or fewer (once per article in this batch)—never more than the number of articles returned.
    4. Write: Build one evaluation object per article (candidate_id = that article's "id" from the same read_candidates response). Call supabase_write_evaluations to insert into coyote_article_evaluations (send at most 2 objects per call if splitting: e.g. 2+2+1 for 5).
    5. Loop: Go back to step 1 (read again with limit=5, offset=0). Do not stop until step 2 says count is 0.

    Do NOT evaluate articles from the Discovery task output or from any list other than the current read_candidates response. Do NOT call thesis_title_relevance_tool for more articles than were returned in the last read_candidates call. You must actually CALL supabase_write_evaluations; do not only put JSON in your Final Answer. Your Final Answer should include PROCESSED_ARTICLES summary and tool output evidence, not the raw evaluations array.
  expected_output: |
    Evidence that supabase_write_evaluations was called for every batch (tool outputs showing inserted counts). Total evaluations inserted (sum of "inserted" from all write_evaluations outputs) should match total candidates (e.g. 40–60 for a full run). Then: PROCESSED_ARTICLES list and summary (total_evaluated, accepted, rejected). Do NOT output the evaluations_json array itself as the Final Answer.
  agent: thesis_relevance_judge
  context:
    - search_for_candidate_articles
