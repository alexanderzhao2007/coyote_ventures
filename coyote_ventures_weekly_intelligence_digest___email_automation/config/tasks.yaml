---
search_for_candidate_articles:
  description: |
    Run 12 distinct news searches—one search per required keyword. Each search must
    include the date filter "after:YYYY-MM-DD" (today minus 14 days). Use only the
    first 5 results returned per search (up to 60 articles total). Reject any article
    older than 14 days.

    The 12 required keywords (search each once):
    health startup valuation, health tech, health funding, health legislation,
    health investment, healthcare innovation, health equity, health policy,
    AI health, virtual health, care model, health conference.

    After EACH search, immediately call supabase_write_candidates with that search's
    results (a JSON array of up to 5 articles: url, title, source, published_date,
    snippet). This avoids a single huge tool payload getting truncated and ensures
    all unique URLs are available in Supabase even if terminal output is cut off.

    After completing all 12 searches (and 12 insert calls), output the full
    CANDIDATE_ARTICLES list (title, URL, source, published date, snippet) and a
    SEARCH LOG listing all 12 queries and article count per query. Do not truncate
    the list.
  expected_output: |
    TOTAL ARTICLES COLLECTED: [count]
    CANDIDATE_ARTICLES: numbered list 60 articles (title, URL, source, date, snippet).
    SEARCH LOG: all 12 search queries and how many articles each returned.
  agent: healthcare_news_discovery_specialist
  async_execution: true

extract_article_content:
  description: |
    Get the full list of candidate articles by calling supabase_read_candidates (with limit=100)
    so you have every URL the Discovery agent wrote—the previous task output may be truncated.
    For each URL, extract full text with the article_extractor tool. Reject articles with under
    200 characters. Call supabase_write_content with a JSON array of extracted articles (url,
    content, extraction_status, word_count, author). Output a summary (total processed, passed,
    rejected with URLs). Do not truncate: process every URL returned by supabase_read_candidates.
  expected_output: |
    FULL_TEXT_ARTICLES: list with url, title, author, published_date, extracted_text,
    extraction_status. Summary: total_processed, passed_length_filter,
    rejected_insufficient_content (URLs).
  agent: article_harvester
  context:
    - search_for_candidate_articles

evaluate_investment_relevance:
  description: |
    Take FULL_TEXT_ARTICLES from the previous task. For each article, use the Thesis
    Article Comparison Tool with the thesis from {thesis_url}. Score 70+ direct thesis
    match, 50–69 market intelligence, under 50 reject. Call supabase_write_evaluations
    with a JSON array (url, relevance_score, confidence_score, signal_type, exec_summary,
    why_it_matters, thesis_sector, focus_area_tags, geography, companies_mentioned,
    sent_in_weekly_digest=false). Include only articles with relevance_score ≥50.
    Output PROCESSED_ARTICLES and a short summary (evaluated, accepted, rejected).
  expected_output: |
    PROCESSED_ARTICLES: list with url, title, content, relevance_score, confidence_score,
    signal_type, exec_summary, why_it_matters, thesis_sector, focus_area_tags,
    geography, companies_mentioned. Summary: total_evaluated, accepted, rejected.
  agent: thesis_relevance_judge
  context:
    - extract_article_content
